name: AMAN FORGE CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Preview tests
        run: npm run test:preview

      - name: Usage summary tests
        run: npm run test:usage

      - name: Shared backend tests
        run: npm run test:shared

      - name: Type-check shared backend modules
        run: npm run typecheck:shared

      - name: Type-check backend functions
        run: npm run typecheck:functions

      - name: Type-check TypeScript utilities
        run: npm run typecheck:utils

      # Existing JS/JSX checkJs diagnostics are recorded as advisory while the
      # baseline is cleaned up; build, lint, and focused tests remain blocking.
      - name: Type check (baseline advisory)
        run: npm run typecheck
        continue-on-error: true

      - name: Upload production build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aman-forge-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
